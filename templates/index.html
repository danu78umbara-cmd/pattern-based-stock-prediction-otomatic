<!DOCTYPE html>
<html>
<head>
    <title>Gold Stock Price Prediction</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        .container { max-width: 500px; }
        label { font-weight: bold; }
        #result {
            margin-top: 25px; padding: 15px;
            border: 1px solid #ccc; background: #fafafa;
            border-radius: 6px;
        }
        button {
            padding: 10px 18px; background: #007bff;
            color: white; border: none; border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #005fcc; }

        /* LOADING TEXT */
        #loading {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Prediksi Harga Saham Emas</h2>

    <label>Kode Saham (contoh: ANTM, BRMS, MEDC, dll):</label><br>
    <input type="text" id="ticker" placeholder="ANTM" style="width: 100%; padding: 6px;"><br><br>

    <button onclick="predict()">Ambil Data & Prediksi</button>

    <div id="loading">⏳ Mengambil data dari Yahoo Finance, tunggu sebentar...</div>

    <div id="result"></div>

</div>

<script>
function predict() {
    const ticker = document.getElementById("ticker").value.trim();
    if (!ticker) {
        alert("Masukkan kode saham!");
        return;
    }

    const payload = { ticker: ticker };

    // --- SHOW LOADING ---
    document.getElementById("loading").style.display = "block";
    document.getElementById("result").innerHTML = "";

    fetch("/predict_ticker", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(async response => {
        const data = await response.json();

        // --- HIDE LOADING ---
        document.getElementById("loading").style.display = "none";

        if (!response.ok) {
            document.getElementById("result").innerHTML =
                `<b>Error:</b> ${data.message}`;
            return;
        }

        document.getElementById("result").innerHTML =
            `<b>Candle Pattern:</b> ${data.CandlePattern}<br>
             <b>Interpretation:</b> ${data.interpretation}<br>
             <b>Prediction:</b> ${data.prediction}`;
    })
    .catch(() => {
        document.getElementById("loading").style.display = "none";
        document.getElementById("result").innerHTML =
            "<b>Error:</b> Gagal menghubungi server.";
    });
}
</script>

</body>
</html>
